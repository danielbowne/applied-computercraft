plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    // appliedcc-neoforge-26.1.2-0.1.0.jar
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = 'https://maven.squiddev.cc'; content { includeGroup 'cc.tweaked' } }
    maven { url = 'https://maven.neoforged.net/releases'; content { includeGroup 'org.appliedenergistics' } }
}

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_version}"
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // present in `./gradlew runServer`, not a published dependency
    localRuntime "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            ae2_version            : ae2_version,
            cc_version             : cc_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def licenseName = "LICENSE_${mod_id}"
jar {
    from('LICENSE') { rename { licenseName } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
