name: Release Please

# Releases are driven by conventional commits on main (see release-please-config.json).
#
# 1. release-please keeps one release PR open (version bump in gradle.properties, new section in
#    CHANGELOG.md). Merging that PR makes it create the tag vX.Y.Z and the GitHub Release.
# 2. Nothing made with GITHUB_TOKEN starts other workflows, so this file does the follow-up
#    itself:
#    - build-release-pr dispatches build.yml on the release PR branch, so the required `build`
#      check runs on the PR head commit;
#    - jar calls release.yml for the new tag (build, attach the jar to the Release);
#    - release-notes rewrites the Release body with Claude when the ANTHROPIC_API_KEY secret
#      exists, and quietly keeps release-please's notes otherwise;
#    - curseforge uploads the jar when the CURSEFORGE_PROJECT_ID repository variable is set.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      pr_branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # prs_created is true when a release PR was opened or updated; `pr` is its JSON.
      - name: Read the release PR branch
        id: pr
        if: steps.rp.outputs.prs_created == 'true'
        env:
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<<"$PR_JSON")
          test -n "$branch" || { echo "release-please reported a PR without a head branch"; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  # A PR pushed with GITHUB_TOKEN does not trigger the push or pull_request run of build.yml.
  # A workflow_dispatch run on the branch creates the `build` check on the branch head commit,
  # which is the PR head, so branch protection sees it. It runs again each time release-please
  # updates the PR.
  build-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch build.yml on the release PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  jar:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Optional. Without the ANTHROPIC_API_KEY secret the job ends after the first step and
  # release-please's notes stay as they are. Any failure after that also keeps the original
  # notes: the release is already published and must not depend on this job.
  release-notes:
    needs: [release-please, jar]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'claude-opus-5-5' }}
    steps:
      # Secrets cannot be read in `if:`, so test the value here and pass the answer on.
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if test -n "$ANTHROPIC_API_KEY"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set; keeping release-please's notes"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.enabled == 'true'
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rewrite the release notes
        if: steps.key.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          warn() { echo "::warning::Release notes not rewritten: $1"; exit 0; }

          cat > system.md <<'PROMPT'
          You write the release notes for Applied ComputerCraft, a Minecraft mod that adds a ComputerCraft peripheral named me_bridge to Applied Energistics 2 blocks, so Lua programs can read and control an AE2 network.

          You receive the draft notes for one release (made from commit subjects), the commit messages, a diff stat and a diff of the mod source and README for that release. Rewrite the notes for the GitHub Release page.

          Output Markdown only, with no preamble, no closing remarks and no code fence around the whole answer. Use exactly this structure and leave out any section that would be empty:

          ## What's new

          3 to 5 bullets in plain language for players and server admins: what they can now do, or what now works better. No class, method or file names in this section.

          ### Added
          ### Fixed
          ### Changed (may affect existing scripts)

          The technical sections list entries for people who write Lua scripts. Anything that can alter or break an existing script or server config goes under Changed.

          Rules:
          - Keep every pull request link and commit link from the draft notes, on the entry it belongs to.
          - Name Lua methods, filter fields, events and config options in backticks where they matter. Take the exact names from the diff and the commit messages.
          - Describe only what the inputs support. Do not invent features, and do not guess at behavior the diff does not show.
          - Leave out docs, CI, refactor and test changes unless users can see an effect.
          - If the draft heading has a compare link, end with one line: Full changelog: followed by that URL.
          - Plain prose. Use regular hyphens, never em dashes. No emojis.
          - Never mention AI, language models, Claude, Anthropic, or that the notes were written or rewritten by a tool.
          PROMPT

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > original.md || warn "could not read the release body"
          test -s original.md || warn "the release body is empty"

          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            base="$prev"; range="$prev..$TAG"
          else
            base=$(git hash-object -t tree /dev/null); range="$TAG"
          fi

          # About 60k characters in total: notes 10k, commits 14k, stat 4k, diff 30k, then a hard cap.
          {
            echo "Version: $VERSION"
            echo "Tag: $TAG"
            echo "Previous tag: ${prev:-none}"
            echo
            echo "=== DRAFT NOTES FROM RELEASE-PLEASE ==="
            head -c 10000 original.md
            echo
            echo "=== COMMITS ==="
            git log "$range" --format='%s%n%n%b%n---' | head -c 14000
            echo
            echo "=== DIFF STAT ==="
            git diff --stat "$base" "$TAG" | head -c 4000
            echo
            echo "=== DIFF OF src/main/java AND README.md (may be cut short) ==="
            git diff "$base" "$TAG" -- src/main/java README.md | head -c 30000
          } > input.full
          head -c 60000 input.full > input.md

          jq -n --arg model "$MODEL" --rawfile system system.md --rawfile input input.md '{
            "model": $model,
            "max_tokens": 16000,
            "output_config": {"effort": "medium"},
            "fallbacks": "default",
            "system": $system,
            "messages": [{"role": "user", "content": $input}]
          }' > request.json || warn "could not build the request"

          curl -sS --fail-with-body https://api.anthropic.com/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "anthropic-version: 2026-10-21" \
            -H "anthropic-beta: server-side-fallback-2026-07-01" \
            -d @request.json > response.json || { head -c 2000 response.json; echo; warn "the API call failed"; }

          stop=$(jq -r '.stop_reason // ""' response.json)
          test "$stop" != "refusal" || warn "the model refused the request"
          test "$stop" != "max_tokens" || warn "the answer was cut off at max_tokens"
          jq -r '.content[] | select(.type == "text") | .text' response.json > final.raw || warn "could not read the answer"

          # Belt and braces for the house rules: no em dashes, no tool names.
          sed "s/$(printf '\342\200\224')/-/g" final.raw > final.md
          grep -q '[^[:space:]]' final.md || warn "the answer was empty"
          if grep -qiE 'claude|anthropic' final.md; then warn "the answer named the tool"; fi

          # Every link in the original notes must survive the rewrite.
          grep -oE 'https://github\.com/[^) >]+' original.md | sort -u | while read -r url; do
            grep -qF "$url" final.md || echo "$url"
          done > missing.txt
          if test -s missing.txt; then
            echo "Links missing from the rewrite:"; cat missing.txt
            warn "the answer dropped links from the original notes"
          fi

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file final.md || warn "could not update the release"
          echo "Release notes for $TAG rewritten with $MODEL"

  # Runs whether or not release-notes ran, failed or was skipped (always()), as long as the jar
  # exists. Skipped entirely when there was no release or CURSEFORGE_PROJECT_ID is unset.
  curseforge:
    needs: [release-please, jar, release-notes]
    if: always() && needs.jar.result == 'success' && vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-jar
          path: dist

      # The changelog is whatever the GitHub Release says now (rewritten or not).
      - name: Fetch the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          test -s notes.md || { echo "The release body of $TAG is empty"; exit 1; }

      # mc-publish quietly skips a platform whose token is empty, which would look like success.
      - name: Check the CurseForge token is set
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$CF_TOKEN" || { echo "CURSEFORGE_PROJECT_ID is set but the CURSEFORGE_TOKEN secret is empty"; exit 1; }

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          name: Applied ComputerCraft ${{ needs.release-please.outputs.version }} (26.1.2)
          version: ${{ needs.release-please.outputs.version }}
          version-type: release
          changelog-file: notes.md
          loaders: neoforge
          game-versions: 26.1.2
          game-version-filter: none
          java: 25
          environment: server | client?
          dependencies: |
            ae2(required){curseforge:applied-energistics-2}
            computercraft(required){curseforge:cc-tweaked}
