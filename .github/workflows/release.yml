name: Release

# Build the jar for a tag and attach it to that tag's GitHub Release.
#
# Normally called from release-please.yml right after release-please creates the tag and the
# Release (tags made with GITHUB_TOKEN do not trigger other workflows, so there is no tag-push
# trigger here). It can also be run by hand from the Actions page with a tag, to rebuild and
# re-attach the jar of an existing release (for example after a failed run).
#
# The tag must equal v + mod_version in gradle.properties at that tag. If the GitHub Release
# does not exist yet (a manual run on an old tag), it is created with the tag's section of
# CHANGELOG.md as notes.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, for example v0.3.0
        required: true
        type: string
    outputs:
      mod_version:
        description: mod_version at the tag
        value: ${{ jobs.release.outputs.mod_version }}
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mod_version: ${{ steps.version.outputs.mod_version }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches mod_version
        id: version
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$v" != "$TAG" ]; then
            echo "tag $TAG does not match mod_version $v"; exit 1
          fi
          echo "mod_version=$v" >> "$GITHUB_OUTPUT"

      - run: ./gradlew build

      # release-please creates the Release with its own notes; this job only adds the jar.
      # The fallback covers a tag without a Release: it takes the tag's section of CHANGELOG.md,
      # whether the heading is "## 0.2.0" (hand-written) or "## [0.3.0](compare-url) (date)".
      - name: Attach the jar to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.version.outputs.mod_version }}
        run: |
          title="Applied ComputerCraft $MOD_VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title"
            gh release upload "$TAG" build/libs/*.jar --repo "$GITHUB_REPOSITORY" --clobber
          else
            awk -v v="$MOD_VERSION" '
              /^## / {
                if (found) exit
                h = $0; sub(/^## \[?/, "", h); split(h, a, /[] (]/)
                if (a[1] == v) { found = 1; next }
              }
              found' CHANGELOG.md > notes.md
            test -s notes.md || { echo "No GitHub Release for $TAG and CHANGELOG.md has no section for $MOD_VERSION"; exit 1; }
            gh release create "$TAG" build/libs/*.jar --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$title" --notes-file notes.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: build/libs/*.jar
          retention-days: 7
