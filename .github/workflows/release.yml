name: Release

# Push a tag like v0.1.0 to build the jar and publish a GitHub Release with it.
# The tag must match mod_version in gradle.properties.
# If the CURSEFORGE_PROJECT_ID repository variable is set, a second job uploads the
# same jar to CurseForge using the CURSEFORGE_TOKEN secret. It is a separate job so a
# failed upload can be re-run on its own without touching the GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      mod_version: ${{ steps.version.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches mod_version
        id: version
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match mod_version $v"; exit 1
          fi
          echo "MOD_VERSION=$v" >> "$GITHUB_ENV"
          echo "mod_version=$v" >> "$GITHUB_OUTPUT"

      - run: ./gradlew build

      - name: Pull this version's notes from CHANGELOG.md
        run: |
          awk -v v="## $MOD_VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $MOD_VERSION' section"; exit 1; }

      # On a re-run the release already exists; leave it as it is.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as is"
          else
            gh release create "$GITHUB_REF_NAME" build/libs/*.jar --repo "$GITHUB_REPOSITORY" \
              --title "Applied ComputerCraft $MOD_VERSION" --notes-file notes.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: |
            build/libs/*.jar
            notes.md
          retention-days: 7

  curseforge:
    needs: release
    if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-jar

      # mc-publish quietly skips a platform whose token is empty, which would look like success.
      - name: Check the CurseForge token is set
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$CF_TOKEN" || { echo "CURSEFORGE_PROJECT_ID is set but the CURSEFORGE_TOKEN secret is empty"; exit 1; }

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*.jar
          name: Applied ComputerCraft ${{ needs.release.outputs.mod_version }} (26.1.2)
          version: ${{ needs.release.outputs.mod_version }}
          version-type: release
          changelog-file: notes.md
          loaders: neoforge
          game-versions: 26.1.2
          game-version-filter: none
          java: 25
          environment: server | client?
          dependencies: |
            ae2(required){curseforge:applied-energistics-2}
            computercraft(required){curseforge:cc-tweaked}
