name: Release

# Push a tag like v0.1.0 to build the jar and publish a GitHub Release with it.
# The tag must match mod_version in gradle.properties.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches mod_version
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match mod_version $v"; exit 1
          fi
          echo "MOD_VERSION=$v" >> "$GITHUB_ENV"

      - run: ./gradlew build

      - name: Pull this version's notes from CHANGELOG.md
        run: |
          awk -v v="## $MOD_VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $MOD_VERSION' section"; exit 1; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "Applied ComputerCraft $MOD_VERSION" --notes-file notes.md

      # Uploads the same jar to CurseForge. Needs the CURSEFORGE_TOKEN secret and the
      # CURSEFORGE_PROJECT_ID repository variable; skipped until the variable is set.
      - name: Publish to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*.jar
          name: Applied ComputerCraft ${{ env.MOD_VERSION }} (26.1.2)
          version: ${{ env.MOD_VERSION }}
          version-type: release
          changelog-file: notes.md
          loaders: neoforge
          game-versions: 26.1.2
          game-version-filter: none
          java: 25
          environment: server | client?
          dependencies: |
            ae2(required){curseforge:223794}
            computercraft(required){curseforge:282001}
