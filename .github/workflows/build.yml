name: Build

# workflow_dispatch is for manual runs from the Actions page. Release PRs get their `build`
# check from the normal pull_request trigger: release-please opens them with a GitHub App token,
# and events made by an App token (unlike GITHUB_TOKEN) do start workflows.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: ./gradlew build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appliedcc-jar
          path: build/libs/*.jar
