name: Build

# workflow_dispatch exists for release PRs: release-please opens them with GITHUB_TOKEN,
# and GitHub does not start workflows for events made by that token, so release-please.yml
# dispatches this workflow on the release branch to produce the required `build` check.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: appliedcc-jar
          path: build/libs/*.jar
